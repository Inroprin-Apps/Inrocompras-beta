<title>INROCOMPRAS v3</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" />
<style>
    /* Estructura: menú lateral (252 px, se contrae a 62) + contenido; la ficha de lo elegido flota a la derecha.
   Tokens de la Guía UI/UX de las apps de INROPRIN: un color por rol, derivados en oklab, escala con nombre. */
    :root {
        --texto: #1d1d1b;
        --primary: #006db1;
        --secondary: #00a298;
        --brand-red: #e30613;
        --brand-yellow: #ffdd00;
        --bg: color-mix(in oklab, var(--texto) 3%, white);
        --surface: #ffffff;
        --surface-2: color-mix(in oklab, var(--texto) 3%, white);
        --surface-3: color-mix(in oklab, var(--texto) 7%, white);
        --line: color-mix(in oklab, var(--texto) 20%, white);
        --divider: color-mix(in oklab, var(--texto) 12%, white);
        --divider-strong: color-mix(in oklab, var(--texto) 38%, white);
        --control: var(--line);
        --control-hover: color-mix(in oklab, var(--texto) 36%, white);
        --ink: var(--texto);
        --ink-2: color-mix(in oklab, var(--texto) 80%, white);
        --ink-3: color-mix(in oklab, var(--texto) 70%, white);
        --on-fill: #ffffff;
        --primary-hover: color-mix(in oklab, var(--primary) 92%, black);
        --primary-active: color-mix(in oklab, var(--primary) 84%, black);
        --primary-strong: color-mix(in oklab, var(--primary) 88%, black);
        --primary-soft: color-mix(in oklab, var(--primary) 12%, white);
        --primary-line: color-mix(in oklab, var(--primary) 22%, white);
        --link: var(--primary);
        --danger: var(--brand-red);
        --danger-strong: color-mix(in oklab, var(--danger) 88%, black);
        --danger-soft: color-mix(in oklab, var(--danger) 12%, white);
        --warning: var(--brand-yellow);
        --warning-strong: color-mix(in oklab, var(--warning) 58%, black);
        --warning-soft: color-mix(in oklab, var(--warning) 12%, white);
        --success: var(--secondary);
        --success-strong: color-mix(in oklab, var(--secondary) 76%, black);
        --success-soft: color-mix(in oklab, var(--secondary) 12%, white);
        --disabled: color-mix(in oklab, var(--texto) 8%, white);
        --disabled-ink: color-mix(in oklab, var(--texto) 40%, white);
        --shadow-card: 0 2px 4px rgba(29, 29, 27, 0.05), 0 6px 16px rgba(29, 29, 27, 0.06);
        --shadow-float: 0 4px 8px rgba(29, 29, 27, 0.06), 0 12px 32px rgba(29, 29, 27, 0.1);
        --r-inner: 7px;
        --r-control: 9px;
        --r-card: 12px;
        --f-display: 24px;
        --f-title: 21px;
        --f-subtitle: 17px;
        --f-heading: 15px;
        --f-body: 14px;
        --f-ui: 13px;
        --f-small: 12px;
        --f-caption: 11px;
        --font: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
            --bg: #17181a;
            --surface: #1f2023;
            --surface-2: #26272b;
            --surface-3: #2e2f34;
            --line: #3c3e44;
            --divider: #33353a;
            --divider-strong: #55585f;
            --control: #4a4d54;
            --control-hover: #6a6e77;
            --ink: #ececea;
            --ink-2: #c6c7c9;
            --ink-3: #a9abaf;
            --primary: #1f7bc0;
            --primary-hover: #2a87cc;
            --primary-active: #3592d6;
            --primary-strong: #9ccbf1;
            --primary-soft: #1a2c3b;
            --primary-line: #24425c;
            --link: #86bdea;
            --danger: #ff5c63;
            --danger-strong: #ffb0b3;
            --danger-soft: #3a1d20;
            --warning: #ffdd00;
            --warning-strong: #f2d65c;
            --warning-soft: #353015;
            --success: #22b8ad;
            --success-strong: #86e0d7;
            --success-soft: #15302d;
            --disabled: #2a2b2f;
            --disabled-ink: #6d7076;
            --shadow-card: 0 2px 4px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.3);
            --shadow-float: 0 4px 8px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.45);
            color-scheme: dark;
        }
    }
    :root[data-theme='dark'] {
        --bg: #17181a;
        --surface: #1f2023;
        --surface-2: #26272b;
        --surface-3: #2e2f34;
        --line: #3c3e44;
        --divider: #33353a;
        --divider-strong: #55585f;
        --control: #4a4d54;
        --control-hover: #6a6e77;
        --ink: #ececea;
        --ink-2: #c6c7c9;
        --ink-3: #a9abaf;
        --primary: #1f7bc0;
        --primary-hover: #2a87cc;
        --primary-active: #3592d6;
        --primary-strong: #9ccbf1;
        --primary-soft: #1a2c3b;
        --primary-line: #24425c;
        --link: #86bdea;
        --danger: #ff5c63;
        --danger-strong: #ffb0b3;
        --danger-soft: #3a1d20;
        --warning: #ffdd00;
        --warning-strong: #f2d65c;
        --warning-soft: #353015;
        --success: #22b8ad;
        --success-strong: #86e0d7;
        --success-soft: #15302d;
        --disabled: #2a2b2f;
        --disabled-ink: #6d7076;
        --shadow-card: 0 2px 4px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.3);
        --shadow-float: 0 4px 8px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.45);
        color-scheme: dark;
    }

    * {
        box-sizing: border-box;
    }
    html,
    body {
        height: 100%;
    }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 var(--f-body)/1.55 var(--font);
        -webkit-font-smoothing: antialiased;
    }
    button,
    input,
    select,
    textarea {
        font: inherit;
        color: inherit;
    }
    button:not(:disabled),
    [role='button'],
    summary,
    select:not(:disabled),
    label:has(> input) {
        cursor: pointer;
    }
    button:disabled {
        cursor: not-allowed;
    }
    a {
        color: var(--link);
    }
    :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }
    .num,
    td.n {
        font-variant-numeric: tabular-nums;
    }
    h1,
    h2,
    h3,
    h4 {
        margin: 0;
        text-wrap: balance;
    }
    .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
    }

    /* ---------- estructura ---------- */
    .app {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        min-height: 100%;
    }
    .side {
        position: sticky;
        top: 0;
        height: 100vh;
        width: 252px;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--line);
        transition: width 0.18s ease;
        overflow: hidden;
        z-index: 20;
    }
    .side.mini {
        width: 62px;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 13px 16px;
    }
    .brand svg {
        flex: none;
    }
    .brand b {
        display: block;
        font-size: var(--f-heading);
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
    }
    .brand span {
        display: block;
        font-size: var(--f-small);
        color: var(--ink-2);
        white-space: nowrap;
    }
    .side.mini .brand div,
    .side.mini .gl,
    .side.mini .it span,
    .side.mini .it .cnt {
        opacity: 0;
        pointer-events: none;
    }
    .nav {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        scrollbar-width: none;
    }
    .gl {
        font-size: var(--f-small);
        font-weight: 500;
        color: var(--ink-2);
        padding: 0 10px 4px;
        white-space: nowrap;
        transition: opacity 0.15s;
    }
    .it {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 10px;
        border: 0;
        background: none;
        border-radius: var(--r-control);
        font-size: var(--f-ui);
        font-weight: 500;
        color: var(--ink-2);
        text-decoration: none;
        white-space: nowrap;
        text-align: left;
    }
    .it:hover {
        background: var(--surface-2);
        color: var(--ink);
    }
    .it.on {
        background: var(--primary-soft);
        color: var(--primary-strong);
    }
    .it svg {
        flex: none;
    }
    .it span {
        transition: opacity 0.15s;
    }
    .cnt {
        margin-left: auto;
        min-width: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--on-fill);
        font-size: var(--f-caption);
        font-weight: 500;
        text-align: center;
        font-variant-numeric: tabular-nums;
        transition: opacity 0.15s;
    }
    .cnt.z {
        background: var(--surface-3);
        color: var(--ink-2);
    }
    .side-foot {
        border-top: 1px solid var(--line);
        padding: 10px;
    }
    .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
    }
    .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 15;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px max(24px, env(safe-area-inset-right, 0px)) 10px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
    }
    .top .menu {
        display: none;
    }
    .top .grow {
        flex: 1;
        min-width: 0;
        font-size: var(--f-ui);
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .verComo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--f-ui);
    }
    .verComo label {
        color: var(--ink-2);
        font-weight: 500;
    }
    .av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: var(--on-fill);
        font-weight: 600;
        font-size: var(--f-ui);
        border: 0;
        flex: none;
    }
    .page {
        padding: 24px max(24px, env(safe-area-inset-right, 0px)) 48px max(24px, env(safe-area-inset-left, 0px));
        display: flex;
        flex-direction: column;
        gap: 20px;
        width: 100%;
        max-width: 1440px;
    }
    .ph {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
    }
    .ph h1 {
        font-size: var(--f-title);
        font-weight: 600;
        line-height: 1.3;
    }
    .ph .sub {
        font-size: var(--f-ui);
        color: var(--ink-2);
        margin-top: 2px;
    }
    .ph .acc {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .crumb {
        font-size: var(--f-ui);
        color: var(--ink-2);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-decoration: none;
        margin-bottom: 4px;
    }
    .crumb:hover {
        color: var(--ink);
    }

    /* ---------- piezas ---------- */
    .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        padding: 20px 22px;
        min-width: 0;
    }
    .card.flush {
        padding: 0;
        overflow: hidden;
    }
    .card-h {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
    }
    .card-h h2 {
        font-size: var(--f-heading);
        font-weight: 600;
    }
    .card-h .meta {
        font-size: var(--f-small);
        color: var(--ink-3);
    }
    .flush .card-h {
        padding: 16px 20px 0;
        margin-bottom: 10px;
    }
    .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
    }
    .kpi {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r-card);
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        text-align: left;
        min-width: 0;
    }
    button.kpi:hover {
        background: var(--surface-2);
    }
    .kpi .l {
        font-size: var(--f-small);
        font-weight: 500;
        color: var(--ink-2);
    }
    .kpi .v {
        font-size: var(--f-display);
        font-weight: 600;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
    }
    .kpi .c {
        font-size: var(--f-small);
        color: var(--ink-3);
    }
    .kpi.risk .l,
    .kpi.risk .c b {
        color: var(--danger-strong);
    }
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        padding: 7px 14px;
        border-radius: var(--r-control);
        border: 1px solid var(--control);
        background: var(--surface);
        color: var(--ink);
        font-size: var(--f-ui);
        font-weight: 500;
        white-space: nowrap;
        text-decoration: none;
        transition:
            background 0.12s,
            border-color 0.12s;
    }
    .btn:hover {
        border-color: var(--control-hover);
        background: var(--surface-2);
    }
    .btn.p {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-fill);
    }
    .btn.p:hover {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
    }
    .btn.p:active {
        background: var(--primary-active);
    }
    .btn.d {
        color: var(--danger-strong);
        border-color: color-mix(in oklab, var(--danger) 40%, var(--surface));
    }
    .btn.d:hover {
        background: var(--danger-soft);
    }
    .btn.g {
        border-color: transparent;
        background: transparent;
        color: var(--ink-2);
    }
    .btn.g:hover {
        background: var(--surface-2);
        color: var(--ink);
    }
    .btn.sm {
        min-height: 30px;
        padding: 4px 10px;
        font-size: var(--f-small);
    }
    .btn:disabled,
    .btn[aria-disabled='true'] {
        background: var(--disabled);
        border-color: var(--disabled);
        color: var(--disabled-ink);
        cursor: not-allowed;
    }
    .lnk {
        border: 0;
        background: none;
        padding: 0;
        color: var(--link);
        font-weight: 500;
        font-size: inherit;
        text-decoration: none;
    }
    .lnk:hover {
        text-decoration: underline;
    }
    .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: var(--f-small);
        font-weight: 500;
        white-space: nowrap;
        background: var(--surface-3);
        color: var(--ink-2);
        max-width: 100%;
    }
    .chip.info {
        background: var(--primary-soft);
        color: var(--primary-strong);
    }
    .chip.ok {
        background: var(--success-soft);
        color: var(--success-strong);
    }
    .chip.warn {
        background: var(--warning-soft);
        color: var(--warning-strong);
    }
    .chip.risk {
        background: var(--danger-soft);
        color: var(--danger-strong);
    }
    .chip .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
    }
    .chip.me {
        background: var(--primary);
        color: var(--on-fill);
    }
    .in,
    select.in,
    textarea.in {
        width: 100%;
        min-height: 36px;
        padding: 7px 11px;
        border: 1px solid var(--control);
        border-radius: var(--r-control);
        background: var(--surface);
        font-size: var(--f-ui);
    }
    .in:hover {
        border-color: var(--control-hover);
    }
    textarea.in {
        min-height: 80px;
        resize: vertical;
    }
    .in.bad {
        border-color: var(--danger);
    }
    .fld {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
    }
    .fld > span {
        font-size: var(--f-ui);
        font-weight: 500;
    }
    .fld small {
        font-size: var(--f-small);
        color: var(--ink-3);
    }
    .fld .err {
        font-size: var(--f-small);
        font-weight: 500;
        color: var(--danger-strong);
    }
    .chk {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: var(--f-ui);
    }
    .chk input {
        margin-top: 3px;
        accent-color: var(--primary);
    }
    .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }
    .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
    }
    .bar .sp {
        flex: 1;
    }
    .search {
        position: relative;
        flex: 1 1 240px;
        max-width: 360px;
    }
    .search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--ink-3);
    }
    .search .in {
        padding-left: 34px;
    }
    .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        padding: 4px 12px;
        border: 1px solid var(--control);
        border-radius: 999px;
        background: var(--surface);
        font-size: var(--f-ui);
        font-weight: 500;
    }
    .pill.on {
        background: var(--primary-soft);
        border-color: var(--primary-line);
        color: var(--primary-strong);
    }
    .pill b {
        font-weight: 500;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
    }
    .pill.on b {
        color: inherit;
    }
    .seg {
        display: inline-flex;
        border: 1px solid var(--control);
        border-radius: var(--r-control);
        padding: 2px;
        gap: 2px;
        background: var(--surface);
    }
    .seg button {
        border: 0;
        background: none;
        padding: 6px 12px;
        border-radius: var(--r-inner);
        font-size: var(--f-ui);
        font-weight: 500;
        color: var(--ink-2);
        white-space: nowrap;
    }
    .seg button.on {
        background: var(--primary-soft);
        color: var(--primary-strong);
    }
    .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
    }
    .tabs button {
        border: 0;
        background: none;
        padding: 10px 12px;
        font-size: var(--f-ui);
        font-weight: 500;
        color: var(--ink-2);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        white-space: nowrap;
    }
    .tabs button.on {
        color: var(--primary-strong);
        border-color: var(--primary);
    }
    .tabs button span {
        margin-left: 6px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--surface-3);
        font-size: var(--f-caption);
        color: var(--ink-2);
    }

    /* tabla */
    .tw {
        overflow-x: auto;
    }
    table.t {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--f-ui);
    }
    .t th {
        text-align: left;
        font-size: var(--f-small);
        font-weight: 500;
        color: var(--ink-3);
        padding: 10px 14px;
        border-bottom: 1px solid var(--divider-strong);
        white-space: nowrap;
        background: var(--surface);
    }
    .t td {
        padding: 11px 14px;
        border-bottom: 1px solid var(--divider);
        vertical-align: middle;
    }
    .t tr:last-child td {
        border-bottom: 0;
    }
    .t tbody tr.r {
        cursor: pointer;
    }
    .t tbody tr.r:hover td {
        background: var(--surface-2);
    }
    .t tbody tr.sel td {
        box-shadow:
            inset 0 1px 0 var(--primary),
            inset 0 -1px 0 var(--primary);
    }
    .t tbody tr.sel td:first-child {
        box-shadow:
            inset 1px 1px 0 var(--primary),
            inset 0 -1px 0 var(--primary);
    }
    .t tbody tr.sel td:last-child {
        box-shadow:
            inset -1px 1px 0 var(--primary),
            inset 0 -1px 0 var(--primary);
    }
    .t .n,
    .t th.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .t .s {
        font-size: var(--f-small);
        color: var(--ink-2);
    }
    .t .main-c b {
        font-weight: 500;
    }
    .t .hijo td:first-child {
        padding-left: 34px;
        position: relative;
    }
    .t .hijo td:first-child::before {

<script>
    /* INROCOMPRAS v3 · motor del flujo.
   Cada entidad (oportunidad o proyecto, línea, solicitud, orden, embarque) lleva una ficha en un paso del
   diagrama BPMN (su id). NODOS dice, para cada paso, a qué rol le toca, qué tiene que hacer y qué salidas
   tiene (las salidas de cada rombo son los botones). Los rombos que decide la regla, no una persona, están en AUTO. */

    const EMPRESAS = { INROPRIN: 'IP', INROPLAS: 'IL', 'CONSORCIO INROPRIN-PUCP': 'CP', COOTEQ: 'CQ' };
    const ROLES = [
        { k: 'comercial', n: 'Comercial y Eval. de proyectos', c: 'cm' },
        { k: 'licitaciones', n: 'Licitaciones', c: 'lic' },
        { k: 'pcp', n: 'PCP', c: 'pcp' },
        { k: 'cg', n: 'Control de Gestión', c: 'cg' },
        { k: 'costos', n: 'Costos', c: 'cos' },
        { k: 'tecnica', n: 'Evaluación técnica', c: 'tec' },
        { k: 'maestros', n: 'Maestros SIDIGE', c: 'mae' },
        { k: 'solicitante', n: 'Área solicitante', c: 'jef' },
        { k: 'jefatura', n: 'Jefatura', c: 'jef' },
        { k: 'jcompras', n: 'Jefe de Compras', c: 'jef' },
        { k: 'compras', n: 'Compras · bienes', c: 'com' },
        { k: 'servicios', n: 'Compras · servicios', c: 'srv' },
        { k: 'importaciones', n: 'Importaciones', c: 'imp' },
        { k: 'gop', n: 'Gerencia de Operaciones', c: 'ger' },
        { k: 'gaf', n: 'Gerencia de Adm. y Finanzas', c: 'gaf' },
        { k: 'finanzas', n: 'Finanzas', c: 'fin' },
        { k: 'contabilidad', n: 'Contabilidad', c: 'con' },
        { k: 'consulta', n: 'Consulta (solo lectura)', c: '' },
    ];
    const ROL = Object.fromEntries(ROLES.map((r) => [r.k, r]));
    const AREAS = ['TICs', 'Pedagogía', 'Producción', 'Diseño'];
    const PARTIDAS = [
        'Comercial y evaluación',
        'Muestras',
        'Adquisición',
        'Adicionales',
        'Transporte',
        'Habilitado',
        'Instalación',
        'Capacitación',
        'Mantenimiento',
        'Administrativo',
    ];
    const FORMAS = ['Contado', 'Crédito', 'Adelanto', 'Contra entrega', 'Letra', 'Tarjeta de crédito', 'Caja chica'];
    const PAGA_ANTES = ['Contado', 'Adelanto', 'Tarjeta de crédito'];
    const EST_PPTO = ['Presupuestado', 'No presupuestado', 'Excede presupuesto', 'Preinversión', 'Administrativo', 'Pre aprobado'];
    const MOTIVOS_FIN = [
        'Documentos incompletos',
        'Datos incorrectos',
        'Falta factura',
        'Falta validación técnica',
        'Monto no coincide',
        'Proveedor incorrecto',
        'Otros',
    ];
    const NIVELES = ['Accesorio incluido', 'Accesorio no incluido', 'Extra', 'Servicio'];
    const CARGA = ['Producción', 'Espera de zarpe', 'Tránsito', 'Llegada', 'En almacén'];
    const TRAMITE = ['Pendiente', 'Documentos completos', 'DAM numerada', 'Levante', 'Costeo cerrado'];
    const CHECK_DOCS = [
        ['fc', 'Factura comercial'],
        ['bl', 'BL o AWB'],
        ['co', 'Certificado de origen'],
        ['seg', 'Póliza de seguro'],
    ];
    const GASTOS_IMP = [
        ['Flete internacional', 'valor'],
        ['Agente de aduanas', 'valor'],
        ['Almacén', 'valor'],
        ['Ad valorem', 'producto'],
        ['Transporte local', 'valor'],
        ['Seguro', 'valor'],
    ];
    const TC = { PEN: 1, USD: 3.75, EUR: 4.05, GBP: 4.75 };
    const AÑO = 2026;
    const RELOJ = { v: 0 };

    const uid = (p) => p + Math.random().toString(36).slice(2, 8).toUpperCase();
    const pen = (m, mon) => (+m || 0) * (TC[mon] || 1);
    const r2 = (n) => Math.round((+n || 0) * 100) / 100;
    const clone = (o) => JSON.parse(JSON.stringify(o));

    /* ---------- consultas ---------- */
    const lineasDe = (S, pid) => Object.values(S.lin).filter((l) => l.pry === pid);
    const lineasOrden = (S, o) => o.lineas.map((id) => S.lin[id]).filter(Boolean);
    const cotEleg = (l) => (l.cots || []).find((c) => c.id === l.eleg);
    const provDe = (S, ruc) => S.prov[ruc] || { ruc, nombre: ruc, origen: 'Nacional', pre: 'verde', verif: false };
    function baseOrden(S, o) {
        return lineasOrden(S, o).reduce((a, l) => a + (l.cant || 0) * (l.base || 0), 0);
    }
    function montoPEN(o) {
        return pen(o.monto, o.mon);
    }
    function docsRequeridos(o) {
        if (o.tipo === 'importacion')
            return [
                ['invoice', 'Invoice'],
                ['bl', 'BL'],
                ['dam', 'DAM'],
            ];
        if (o.tipo === 'servicio')
            return [
                ['factura', 'Factura'],
                ['conformidad', 'Acta de conformidad'],
            ];
        if (['Crédito', 'Letra', 'Contra entrega'].includes(o.forma))
            return [
                ['factura', 'Factura'],
                ['guia', 'Guía de remisión'],
            ];
        return [['factura', 'Factura']];
    }
    const faltanDocs = (o) => docsRequeridos(o).filter(([k]) => !(o.docs || {})[k]);
    function partePro(S, l) {
        return l.pry ? S.pry[l.pry] : null;
    }

    /* ---------- contexto de una acción ---------- */
    function ctx(S, rol, who, now) {
        const X = {
            S,
            rol,
            who,
            now: now || RELOJ.v || Date.now(),
            touched: new Set(),
            created: [],
            msgs: [],
            t(e) {
                X.touched.add(e._t + ':' + e.id);
                return e;
            },
            log(e, txt, extra) {
                X.t(e);
                e.hist = e.hist || [];
                e.hist.unshift(Object.assign({ t: X.now, r: X.rol, u: X.who || '', x: txt, n: e.nodo }, extra || {}));
                if (e.hist.length > 40) e.hist.length = 40;
            },
            nuevo(tipo, obj) {
                const e = Object.assign({ id: obj.id || uid(tipo.slice(0, 1).toUpperCase()), _t: tipo, creado: X.now, desde: X.now, hist: [] }, obj);
                S[tipo][e.id] = e;
                X.created.push(tipo + ':' + e.id);
                X.t(e);
                return e;
            },
            aviso(txt) {
                X.msgs.push(txt);
            },
            seq(k) {
                S.cfg.seq = S.cfg.seq || {};
                S.cfg.seq[k] = (S.cfg.seq[k] || 0) + 1;
                X.touched.add('cfg:cfg');
                return S.cfg.seq[k];
            },
        };
        return X;
    }

    /* mueve la ficha a un paso y resuelve en cadena los rombos automáticos */
    function mover(e, to, X, nota) {
        let guard = 0;
        while (to && guard++ < 20) {
            e.nodo = to;
            e.desde = X.now;
            X.t(e);
            const a = AUTO[e._t + ':' + to] || AUTO[to];
            if (!a) break;
            const [sig, porque] = a(e, X);
            if (porque) X.log(e, porque, { auto: to });
            if (sig === to) break;
            to = sig;
        }
        if (nota) X.log(e, nota);
        return e;
    }

    /* ---------- rombos que decide la regla ---------- */
    const AUTO = {
        /* línea */
        gbuy(l, X) {

    /* ---------- utilidades del dominio ---------- */
    function vivas(l) {
        return (l.cots || []).filter((c) => c.pre !== 'rechazado');
    }
    function skuParecidos(S, l) {
        const norm = (s) =>
            String(s || '')
                .toLowerCase()
                .replace(/[^a-z0-9]/g, '');
        const tk = norm(l.tipoArt),
            mk = norm(l.marca),
            mo = norm(l.modelo);
        const out = [],
            vistos = new Set();
        Object.values(S.lin).forEach((x) => {
            if (!x.sku || x.id === l.id || vistos.has(x.sku)) return;
            const st = norm(x.tipoArt) === tk && tk,
                sm = mk && norm(x.marca) === mk,
                smo = mo && norm(x.modelo) === mo;
            if (st && (sm || smo || (!mk && !mo))) {
                vistos.add(x.sku);
                out.push({ sku: x.sku, desc: `${x.tipoArt || ''} ${x.marca || ''} ${x.modelo || ''}`.trim(), igual: sm && smo });
            }
        });
        (S.cfg.articulos || []).forEach((a) => {
            if (!vistos.has(a.sku) && norm(a.tipo) === tk && (!mk || norm(a.marca) === mk)) {
                vistos.add(a.sku);
                out.push({ sku: a.sku, desc: `${a.tipo} ${a.marca} ${a.modelo}`, igual: norm(a.modelo) === mo });
            }
        });
        return out;
    }
    function precalifica(ruc) {
        const d = +String(ruc).slice(-1);
        return d === 7 || d === 9 ? 'rojo' : 'verde';
    }
    function crearOrden(l, X) {
        const S = X.S,
            c = cotEleg(l),
            p = provDe(S, c.ruc),
            pr = partePro(S, l);
        const grupo = Object.values(S.lin).filter((x) => x.nodo === 't14' && x.pry === l.pry && cotEleg(x) && cotEleg(x).ruc === c.ruc && x.tipo === l.tipo);
        const tipo = p.origen === 'Extranjero' ? 'importacion' : l.tipo === 'servicio' ? 'servicio' : 'nacional';
        const empresa = (pr && pr.empresa) || 'INROPRIN',
            serie = EMPRESAS[empresa] || 'IP',

    }
    function exportarVista(k) {
        const L = k === 'plan-proyecto' ? lineasDe(APP.S, APP.pid) : Object.values(APP.S.lin);
        if (k === 'ordenes')
            return exportar(
                'ordenes.csv',
                [
                    ['Orden', (o) => o.num],
                    ['Proveedor', (o) => provDe(APP.S, o.ruc).nombre],
                    ['RUC', (o) => o.ruc],
                    ['Proyecto', (o) => (APP.S.pry[o.pry] || {}).nombre || 'Administrativa'],
                    ['Tipo', (o) => o.tipo],
                    ['Moneda', (o) => o.mon],
                    ['Monto', (o) => o.monto],
                    ['Forma de pago', (o) => o.forma],
                    ['Estado del presupuesto', (o) => o.estPpto || ''],
                    ['Paso', (o) => nodoDe(o).n],
                    ['Le toca a', (o) => quien(o)],
                ],
                Object.values(APP.S.ord),
            );
        return exportar(
            k === 'plan' ? 'plan-de-compras.csv' : 'plan-del-proyecto.csv',
            [
                ['Proyecto', (l) => (APP.S.pry[l.pry] || {}).nombre || 'Administrativa'],
                ['Código', (l) => l.cod || ''],
                ['Línea', (l) => l.desc],
                ['Nivel', (l) => l.niv],
                ['Área', (l) => l.area],
                ['Partida', (l) => l.partida || ''],
                ['Cantidad', (l) => l.cant],
                ['Base S/', (l) => l.base],
                ['SKU', (l) => l.sku || ''],
                ['RQ', (l) => l.rq || ''],
                ['Paso', (l) => (l.nodo === 'enorden' && APP.S.ord[l.oc] ? nodoDe(APP.S.ord[l.oc]).n : nodoDe(l).n)],
            ],
            L,
        );
    }

    /* ---------- arranque ---------- */
    function montar() {
        document.documentElement.lang = 'es';
        document.body.insertAdjacentHTML(
            'afterbegin',
            `<div class="app"><aside id="side" class="side"></aside><div class="main"><header id="top" class="top"></header><main id="page" class="page" tabindex="-1"></main></div></div><aside id="pan" class="pan" hidden aria-label="Ficha"></aside><div id="toasts" class="toasts" aria-live="polite"></div><div id="modal"></div>`,
        );
        APP.mini = LS.get('inrocompras-v3-mini', false);
        APP.rol = LS.get(LSKEY + '-rol', MODO === 'libre' ? 'compras' : 'consulta');
        APP.area = LS.get(LSKEY + '-area', 'Todas');
        if (!ROL[APP.rol]) APP.rol = 'compras';
    }
    function arrancarLibre() {
        const g = LS.get(LSKEY, null);
        APP.S = g && g.v === VERSION_EJ && g.S ? g.S : construirEjemplo();
        ruta();
    }
    async function arrancarEquipo() {
        APP.S = { pry: {}, lin: {}, ord: {}, emb: {}, sol: {}, prov: {}, cfg: { seq: {}, articulos: [] } };
        ruta();
        const lento = setTimeout(() => {
            APP.lento = true;
            if (APP.cargando) pintarMain();
        }, 10000);
        const [db, user] = await Promise.all([window.claude ? null : null, window.claude ? null : null]);
        if (!db) {
            clearTimeout(lento);
            APP.cargando = false;
            APP.sinDb = true;
            render();
            return;
        }
        APP.db = db;
        APP.user = user;
        if (user) {
            const me = await user.me();
            APP.me = { id: me.id, name: me.name };
            APP.admin = !!(me.isOwner || me.canEdit);
            const w = user.can ? await user.can('data.write') : null;
            if (w === false) APP.lectura = true;
        }
        let pendientes = 8;
        const listo = () => {
            if (--pendientes <= 0 && APP.cargando) {
                clearTimeout(lento);
                APP.cargando = false;
                APP.lento = false;
                if (APP.me && APP.me.id && !APP.miembros[APP.me.id]) elegirRol();
                render();
            }
        };
        let deb;
        const repintar = () => {
            clearTimeout(deb);
            deb = setTimeout(render, 80);
        };
        ['pry', 'lin', 'ord', 'emb', 'sol', 'prov'].forEach((t) => {
            let primera = true;
            db.collection(t).onSnapshot(
                (snap) => {
                    const m = {};
                    snap.docs.forEach((d) => {
                        const x = JSON.parse(JSON.stringify(d.data()));
                        if (t === 'prov') m[d.id] = x;
                        else m[d.id] = Object.assign(x, { id: d.id, _t: t });
                    });
                    APP.S[t] = m;
                    if (primera && !snap.metadata.fromCache) {
                        primera = false;
                        listo();
                    } else if (primera) {
                        primera = false;
                        listo();
                    }
                    repintar();
                },
                (err) => {
                    listo();
                    toast({ txt: 'Se perdió la conexión con los datos del piloto.', sub: 'Recarga la página para volver a intentar.', tone: 'risk' });
                },
            );
        });
        db.doc('cfg/cfg').onSnapshot(
            (s) => {
                if (s.exists) APP.S.cfg = JSON.parse(JSON.stringify(s.data()));
                listo();
            },
            () => listo(),
        );
        db.collection('miembros').onSnapshot(
            (snap) => {
                const m = {};
                snap.docs.forEach((d) => {
                    m[d.id] = d.data();
                });
                APP.miembros = m;
                if (APP.me && m[APP.me.id] && !APP.admin) {
                    APP.rol = m[APP.me.id].rol;
                    APP.area = m[APP.me.id].area || 'Todas';
                } else if (APP.me && m[APP.me.id] && APP.admin && !LS.get(LSKEY + '-rol', null)) {
                    APP.rol = m[APP.me.id].rol;
                }
                listo();
                repintar();
            },
            () => listo(),
        );
    }
    function elegirRol() {
        let rol = 'consulta';
        APP.modal = {
            titulo: 'Bienvenido al piloto de INROCOMPRAS',
            texto: 'Elige tu rol. Verás primero lo que te toca hacer a ti; el dueño del piloto puede cambiarlo después.',
            ok: 'Entrar',
            cerrable: false,
            html: `<div class="roles" role="radiogroup" aria-label="Roles">${ROLES.map((r) => `<button type="button" class="${r.k === rol ? 'on' : ''}" data-pickrol="${r.k}" role="radio" aria-checked="${r.k === rol}">${esc(r.n)}</button>`).join('')}</div>`,
            campos: [{ k: 'area', l: 'Si eres de evaluación técnica, tu área', tipo: 'sel', op: ['Todas'].concat(AREAS), req: false }],
            run: async (v) => {
                const elegido = (document.querySelector('[data-pickrol].on') || {}).dataset
                    ? document.querySelector('[data-pickrol].on').dataset.pickrol
                    : 'consulta';
                try {
                    await APP.db.doc('miembros/' + APP.me.id).set({ rol: APP.modalRol || 'consulta', area: v.area || 'Todas', desde: Date.now() });
                    APP.rol = APP.modalRol || 'consulta';
                    APP.area = v.area || 'Todas';
                    LS.set(LSKEY + '-rol', APP.rol);
                    render();
                    toast({ txt: `Entraste como ${rolN(APP.rol)}.` });
                } catch (err) {
                    toast({ txt: 'No se pudo guardar tu rol.', sub: 'Pide al dueño acceso de colaborador.', tone: 'risk' });
                    APP.lectura = true;
                    render();
                }
            },
        };
        APP.modalRol = 'consulta';
    }
    document.addEventListener('click', (ev) => {
        const b = ev.target.closest('[data-pickrol]');
        if (!b) return;
        APP.modalRol = b.dataset.pickrol;
        document.querySelectorAll('[data-pickrol]').forEach((x) => {
            x.classList.toggle('on', x === b);
            x.setAttribute('aria-checked', x === b);
        });
    });

    montar();
    if (MODO === 'libre') arrancarLibre();
    else arrancarEquipo();
</script>
